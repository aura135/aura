<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="100%" stop-color="#0B0E14" />
    </radialGradient>
    <linearGradient id="orbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
    <linearGradient id="magentaGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#243048" stroke-width="2" />

  <!-- Outer Orbital Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#7F00FF" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="24 16" />

  <!-- Core Glowing AI Orb -->
  <circle cx="256" cy="256" r="88" fill="url(#orbGradient)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="70" fill="url(#magentaGradient)" opacity="0.85" />
  <circle cx="230" cy="230" r="26" fill="#FFFFFF" opacity="0.45" filter="blur(4px)" />

  <!-- Stylized Inner AURA Waveform -->
  <path d="M 216 256 Q 236 216 256 256 T 296 256" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" />
</svg>
